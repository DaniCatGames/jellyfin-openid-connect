name: "Autolabel PRs"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  call:
    permissions:
      pull-requests: write
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/autolabel.yaml@72779f42623032ec7f12a9c30f91d78f66be3fab # master
    with:
      repository-name: DaniCatGames/jellyfin-plugin-oidc
    secrets:
      token: ${{ secrets.RELEASE_PAT }}
