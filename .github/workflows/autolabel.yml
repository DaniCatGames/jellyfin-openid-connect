name: "Autolabel PRs"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  call:
    permissions:
      pull-requests: write
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/autolabel.yaml@601009caac9d7e9f891ef8ed8bb9446490b7c1c1 # master
    with:
      repository-name: DaniCatGames/jellyfin-plugin-oidc
    secrets:
      token: ${{ secrets.RELEASE_PAT }}
