name: "Autolabel PRs"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  call:
    permissions:
      pull-requests: write
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/autolabel.yaml@facf0dc93920880bb311641b5117eae2df8cca63 # master
    with:
      repository-name: DaniCatGames/jellyfin-plugin-oidc
    secrets:
      token: ${{ secrets.RELEASE_PAT }}
