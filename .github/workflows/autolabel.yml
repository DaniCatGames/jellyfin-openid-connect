name: "Autolabel PRs"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  call:
    permissions:
      pull-requests: write
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/autolabel.yaml@8eed318e74aed0a7cc41de6dafd36eb693a1f6fc # master
    with:
      repository-name: DaniCatGames/jellyfin-plugin-oidc
    secrets:
      token: ${{ secrets.RELEASE_PAT }}
