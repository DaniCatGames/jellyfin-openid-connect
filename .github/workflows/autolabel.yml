name: "Autolabel PRs"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  call:
    permissions:
      pull-requests: write
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/autolabel.yaml@c5847d4d5a8a577632723fe0ff120d9ddcbc5d09 # master
    with:
      repository-name: DaniCatGames/jellyfin-plugin-oidc
    secrets:
      token: ${{ secrets.RELEASE_PAT }}
