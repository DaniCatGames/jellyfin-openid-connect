name: "Release Drafter & Prep PR"

on:
  push:
    branches: [main]
    paths-ignore: [build.yaml]
  workflow_dispatch:

jobs:
  call:
    permissions:
      contents: write
      pull-requests: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@8eed318e74aed0a7cc41de6dafd36eb693a1f6fc # master
    with:
      repository-name: DaniCatGames/jellyfin-openid-connect
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
