name: "Release Drafter & Prep PR"

on:
  push:
    branches: [main]
    paths-ignore: [build.yaml]
  workflow_dispatch:

jobs:
  call:
    permissions:
      contents: write
      pull-requests: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@601009caac9d7e9f891ef8ed8bb9446490b7c1c1 # master
    with:
      repository-name: DaniCatGames/jellyfin-openid-connect
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
