name: "Release Drafter & Prep PR"

on:
  push:
    branches: [main]
    paths-ignore: [build.yaml]
  workflow_dispatch:

jobs:
  call:
    permissions:
      contents: write
      pull-requests: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@c5847d4d5a8a577632723fe0ff120d9ddcbc5d09 # master
    with:
      repository-name: DaniCatGames/jellyfin-openid-connect
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
