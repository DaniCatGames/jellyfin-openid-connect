<!doctype html>
<html lang="en">
<head>
    <!-- Polyfill styles that are missing when serving without dashboard -->
    <link href="emby-restyle.css" rel="stylesheet"/>
    <link id="theme-style" rel="stylesheet"/>
    <script defer>
        import("./ApiClient.js").then((clientModule) => {
            import("./linking.js").then((renderer) => {
                const view = document.querySelector("#sso-linking-page");

                document.querySelector("#theme-style").href = ApiClient.getUrl(
                    "/web/themes/dark/theme.css",
                );

                const homeButton = document.querySelector("a.emby-button.home");
                homeButton.href = ApiClient.serverAddress();
                homeButton.style.display = "";
                renderer.default(view);
            });
        });
    </script>
    <title>SSO Linking</title>
</head>
<body class="force-scroll dashboardDocument mouseIdle">
<div
    class="page type-interior pluginConfigurationPage esqConfigurationPage"
    data-controller="__plugin/openid-connect-linking.js"
    data-role="page"
    id="sso-linking-page"
>
    <div data-role="content">
        <div class="content-primary" style="max-width: 900px; margin: 0 auto; padding-top: 1em;">

            <!-- Hardcoded flex layout to prevent stacking -->
            <div
                style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1em; margin-bottom: 1.5em;">
                <div style="display: flex; align-items: center; gap: 1em;">
                    <a class="raised emby-button home" style="display: none; margin: 0;">
                        <span>Home</span>
                    </a>
                    <h2 class="sectionTitle" style="margin: 0;">OpenID Connect Linking</h2>
                </div>

                <a
                    class="raised button-alt emby-button"
                    href="https://github.com/DaniCatGames/jellyfin-openid-connect"
                    is="emby-button"
                    style="margin: 0;"
                    target="_blank"
                >
                    Help
                </a>
            </div>

            <div
                style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--card-border, #333); border-radius: 0.4em; padding: 1em; margin: 1.5em 0;">
                <p style="margin: 0 0 0.5em 0;">
                    Link external identity providers to your Jellyfin account for quick sign-in.
                    Use the <strong>+ Link Account</strong> button to add a link, or select existing links and press
                    Delete to remove them.
                </p>
                <p style="margin: 0; font-size: 0.9em; color: var(--secondary-text, #aaa);">
                    See the <a class="button-link" href="https://github.com/DaniCatGames/jellyfin-openid-connect"
                               is="emby-linkbutton">homepage</a> for more information.
                </p>
            </div>

            <div id="sso-provider-list" style="margin-bottom: 2em;">
                <!-- JS will populate providers here -->
            </div>

            <button
                class="button-delete raised emby-button"
                disabled="disabled"
                id="btn-delete-selected-links"
                type="button"
            >
                <span aria-hidden="true" class="material-icons delete"></span>
                <span>Delete Selected</span>
            </button>
        </div>
    </div>
</div>
</body>
</html>
